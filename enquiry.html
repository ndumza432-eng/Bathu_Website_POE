<body><header><div class="logo">BATHU</div><nav><a href="index.html">Home</a><a href="about.html">About Us</a><a href="products.html">Products</a><a class="active" href="enquiry.html">Enquiry</a><a href="contact.html">Contact</a></nav></header>
<main><section class="page-title"><p class="orange">CUSTOMER SUPPORT</p><h1>Make an Enquiry</h1><p>Complete the form below.</p></section>
<section class="section form-section"><form id="enquiryForm">
<label>Full Name *<input id="name" type="text" required></label>
<label>Email Address *<input id="email" type="email" required></label>
<label>Phone Number<input id="phone" type="tel"></label>
<label>Enquiry Type *<select id="type" required><option value="">Select an option</option><option>Product enquiry</option><option>Size enquiry</option><option>Stock availability</option><option>Delivery enquiry</option><option>Returns / exchange</option><option>General enquiry</option></select></label>
<label>Product<input id="product" type="text"></label>
<label>Message *<textarea id="message" rows="6" required></textarea></label>
<label class="checkbox"><input type="checkbox" required> I confirm that the information is correct.</label>
<button class="button" type="submit">Submit Enquiry</button><p id="formMessage" class="success"></p>
</form></section></main><footer><p><strong>BATHU</strong> — Walk Your Journey.</p><p>Educational POE website project.</p></footer><script src="js/script.js"></script></body></html>
